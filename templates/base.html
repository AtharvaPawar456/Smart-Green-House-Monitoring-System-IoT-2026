<!-- templates/base.html -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GreenSense</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        body {
            background-color: #050816;
            background-image:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .glowBox {
            box-shadow:
                0 0 20px rgba(34,197,94,0.2),
                0 0 50px rgba(34,197,94,0.08);
        }

    </style>

</head>

<body class="text-white min-h-screen">

    <div class="flex">

        <!-- SIDEBAR -->

        <aside id="sidebar"
            class="fixed lg:relative z-50 top-0 left-0 h-screen w-72 bg-slate-900 border-r border-slate-800 transform -translate-x-full lg:translate-x-0 transition duration-300">

            <div class="p-6 flex items-center justify-between border-b border-slate-800">

                <div>
                    <h1 class="text-2xl font-black text-green-400">
                        GreenSense
                    </h1>

                    <p class="text-sm text-slate-400">
                        Smart IoT Platform
                    </p>
                </div>

                <button onclick="closeSidebar()" class="lg:hidden text-2xl">
                    ✕
                </button>

            </div>

            <nav class="p-5 space-y-3">

                <a href="/" class="block bg-slate-800 hover:bg-green-500 hover:text-black transition rounded-xl p-4">Home</a>
                <a href="/logdata" class="block bg-slate-800 hover:bg-green-500 hover:text-black transition rounded-xl p-4">Logs</a>
                <a href="/apiguide" class="block bg-slate-800 hover:bg-green-500 hover:text-black transition rounded-xl p-4">API Guide</a>
                
                <a href="/predict" class="block bg-slate-800 hover:bg-green-500 hover:text-black transition rounded-xl p-4">AI Predict</a>
                
                <a href="/aboutus" class="block bg-slate-800 hover:bg-green-500 hover:text-black transition rounded-xl p-4">AboutUs</a>
                <a href="/profile" class="block bg-slate-800 hover:bg-green-500 hover:text-black transition rounded-xl p-4">Profile</a>
                <a href="/logout" class="block bg-red-500 hover:bg-red-400 transition rounded-xl p-4 text-black font-bold">Logout</a>

            </nav>

        </aside>

        <!-- OVERLAY -->

        <div id="overlay"
            onclick="closeSidebar()"
            class="hidden fixed inset-0 bg-black/70 z-40 lg:hidden">
        </div>

        <!-- CONTENT -->

        <main class="flex-1 min-h-screen">

            <header class="border-b border-slate-800 bg-slate-900/70 backdrop-blur-xl">

                <div class="px-6 py-5 flex items-center justify-between">

                    <div class="flex items-center gap-4">

                        <button onclick="openSidebar()" class="lg:hidden text-3xl">
                            ☰
                        </button>

                        <div>
                            <h1 class="text-2xl font-black">
                                GreenSense
                            </h1>

                            <p class="text-sm text-slate-400">
                                Smart-Green-House-Monitoring-System-IoT
                            </p>
                        </div>

                    </div>

                    {% if session.username %}
                    <div class="text-xl text-green-400 font-bold">
                        {{ session.username | title }}
                    </div>
                    {% endif %}

                </div>

            </header>

            <div class="p-5">
                {% block content %}{% endblock %}
            </div>

        </main>

    </div>

    <script>

        function openSidebar() {

            document.getElementById("sidebar").classList.remove("-translate-x-full");
            document.getElementById("overlay").classList.remove("hidden");

        }

        function closeSidebar() {

            document.getElementById("sidebar").classList.add("-translate-x-full");
            document.getElementById("overlay").classList.add("hidden");

        }

    </script>

</body>
</html>
